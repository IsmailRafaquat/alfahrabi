<abp-page [title]="'::Menu:Students' | abpLocalization">
  <abp-page-toolbar-container class="col">
    <!-- <div class="text-end gap-2">
      <button class="btn btn-outline-primary btn-sm mb-0 me-2" type="button" (click)="excelInput.click()"
        [disabled]="importingExcel">
        <i class="fa fa-upload me-1"></i>
        <span class="d-none d-sm-inline">{{ '::ImportStudents' | abpLocalization }}</span>
        <span *ngIf="importingExcel" class="ms-2 spinner-border spinner-border-sm"></span>
      </button>

      <input #excelInput type="file" accept=".xlsx" hidden (change)="onExcelSelectedAndImport($event)" />


      <button class="btn btn-outline-primary btn-sm me-2" type="button" (click)="openTemplateModal()">
        <i class="fa fa-file-excel me-1"></i>
        <span class="d-none d-sm-inline">{{ '::DownloadImportTemplate' | abpLocalization }}</span>
      </button>
      <button id="create" class="btn btn-primary btn-sm" type="button" (click)="createStudent()">
        <i class="fa fa-plus me-1"></i>
        {{ '::NewStudent' | abpLocalization }}
      </button>

    </div> -->
    <div class="text-end">

      <!-- Desktop / tablet (sm and up) -->
      <div class="d-none d-sm-flex justify-content-end gap-2">
        <button class="btn btn-outline-primary btn-sm" type="button" (click)="excelInput.click()"
          [disabled]="importingExcel">
          <i class="fa fa-upload me-1"></i>
          {{ '::ImportStudents' | abpLocalization }}
          <span *ngIf="importingExcel" class="ms-2 spinner-border spinner-border-sm"></span>
        </button>

        <button class="btn btn-outline-primary btn-sm" type="button" (click)="openTemplateModal()">
          <i class="fa fa-file-excel me-1"></i>
          {{ '::DownloadImportTemplate' | abpLocalization }}
        </button>

        <button id="create" class="btn btn-primary btn-sm" type="button" (click)="createStudent()">
          <i class="fa fa-plus me-1"></i>
          {{ '::NewStudent' | abpLocalization }}
        </button>
      </div>

      <!-- Mobile (xs only) -->
      <div class="d-flex d-sm-none justify-content-end">
        <div ngbDropdown class="dropdown">
          <button class="btn btn-primary btn-sm" ngbDropdownToggle type="button" [disabled]="importingExcel">
            <i class="fa fa-ellipsis-v me-1"></i>
            {{ '::Actions' | abpLocalization }}
            <span *ngIf="importingExcel" class="ms-2 spinner-border spinner-border-sm"></span>
          </button>

          <div ngbDropdownMenu class="dropdown-menu dropdown-menu-end">
            <button class="dropdown-item" type="button" (click)="excelInput.click()" [disabled]="importingExcel">
              <i class="fa fa-upload me-2"></i>
              {{ '::ImportStudents' | abpLocalization }}
            </button>

            <button class="dropdown-item" type="button" (click)="openTemplateModal()">
              <i class="fa fa-file-excel me-2"></i>
              {{ '::DownloadImportTemplate' | abpLocalization }}
            </button>

            <div class="dropdown-divider"></div>

            <button class="dropdown-item" type="button" (click)="createStudent()">
              <i class="fa fa-plus me-2"></i>
              {{ '::NewStudent' | abpLocalization }}
            </button>
          </div>
        </div>
      </div>

      <input #excelInput type="file" accept=".xlsx" hidden (change)="onExcelSelectedAndImport($event)" />
    </div>

  </abp-page-toolbar-container>

  <!-- Header -->
  <div class="card">
    <div class="card-body">
      <div class="row align-items-center">
        <div class="col-8 col-sm-10">
          <div class="input-group input-group-sm">
            <input type="text" class="form-control" [placeholder]="'::SearchHere' | abpLocalization" id="filter-text"
              [(ngModel)]="filters.filter" />
            <button type="button" class="btn btn-primary btn-sm" title="Search" (click)="this.list.get()">
              <i class="fa fa-search"></i>
            </button>
          </div>
        </div>
        <div class="col-4 col-sm-2 text-end">
          <button class="btn btn-outline-primary btn-sm w-100" type="button" (click)="showFilter = !showFilter">
            <i class="fas fa-filter d-sm-none"></i>
            <span class="d-none d-sm-inline">{{ '::Filters' | abpLocalization }}</span>
            <i class="fas fa-angle-down ms-1" *ngIf="!showFilter"></i>
            <i class="fas fa-angle-up ms-1" *ngIf="showFilter"></i>
          </button>
        </div>
      </div>

      <!-- Filters -->
      <div *ngIf="showFilter" class="mt-2">
        <div class="row g-2">
          <div class="col-sm-2">
            <label class="form-label" for="admissionNoFilter">{{ '::AdmissionNo' | abpLocalization }}</label>
            <input id="admissionNoFilter" class="form-control form-control-sm" [(ngModel)]="filters.admissionNo" />
          </div>

          <div class="col-sm-2">
            <label class="form-label" for="firstNameFilter">{{ '::FirstName' | abpLocalization }}</label>
            <input id="firstNameFilter" class="form-control form-control-sm" [(ngModel)]="filters.firstName" />
          </div>

          <div class="col-sm-2">
            <label class="form-label" for="lastNameFilter">{{ '::LastName' | abpLocalization }}</label>
            <input id="lastNameFilter" class="form-control form-control-sm" [(ngModel)]="filters.lastName" />
          </div>

          <div class="col-sm-2">
            <label>{{ '::Gender' | abpLocalization }}</label>
            <nz-select [(ngModel)]="filters.gender" class="form-control-sm" nzAllowClear class="w-100">
              <nz-option *ngFor="let gender of genders" [nzValue]="gender.value"
                [nzLabel]="'::Enum:Gender.' + gender.value | abpLocalization"></nz-option>
            </nz-select>
          </div>

          <div class="col-sm-2">
            <label>{{ '::Status' | abpLocalization }}</label>
            <nz-select [(ngModel)]="filters.status" class="form-control-sm" nzAllowClear class="w-100">
              <nz-option *ngFor="let status of status" [nzValue]="status.value"
                [nzLabel]="'::Enum:Status.' + status.value | abpLocalization"></nz-option>
            </nz-select>
          </div>


          <!-- <div class="col-sm-2">
            <label class="form-label" for="enrollDateFrom">{{ '::EnrollmentDateFrom' | abpLocalization }}</label>
            <input id="enrollDateFrom" class="form-control form-control-sm" type="date" [(ngModel)]="filters.enrollmentDateFrom" />
          </div>

          <div class="col-sm-2">
            <label class="form-label" for="enrollDateTo">{{ '::EnrollmentDateTo' | abpLocalization }}</label>
            <input id="enrollDateTo" class="form-control form-control-sm" type="date" [(ngModel)]="filters.enrollmentDateTo" />
          </div> -->

          <div class="col-sm-auto d-flex align-items-end mt-2 gap-1">
            <button type="button" class="btn btn-sm btn-outline-primary" (click)="clearFilters()">
              <i class="fas fa-undo"></i> {{ '::Reset' | abpLocalization }}
            </button>
            <button type="button" class="btn btn-primary btn-sm" (click)="this.list.get()">
              <i class="fa fa-filter"></i> {{ '::Filters' | abpLocalization }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Data Table -->
  <div class="card">
    <div class="card-body table-responsive">
      <ngx-datatable [rows]="students.items" [count]="students.totalCount" [list]="list" default>
        <ngx-datatable-column [name]="'::Actions' | abpLocalization" [maxWidth]="150" [sortable]="false">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <div ngbDropdown container="body" class="d-inline-block">
              <button class="btn btn-primary btn-sm dropdown-toggle" ngbDropdownToggle>
                <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
              </button>
              <div ngbDropdownMenu>
                <!-- <button ngbDropdownItem (click)="editStudent(row.id)">
                  {{ '::Edit' | abpLocalization }}
                </button> -->
                <button ngbDropdownItem (click)="delete(row.id)">
                  {{ '::Delete' | abpLocalization }}
                </button>
                <button ngbDropdownItem (click)="viewStudentDetails(row.id)">
                  {{ '::ViewDetails' | abpLocalization }}
                </button>
                <button ngbDropdownItem (click)="openWhatsApp(row.pPhone)">
                  {{ '::MessageToParent' | abpLocalization }}
                </button>
              </div>
            </div>
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column [name]="'::AdmissionNo' | abpLocalization" prop="admissionNo"></ngx-datatable-column>
        <ngx-datatable-column [name]="'::FirstName' | abpLocalization" prop="firstName"></ngx-datatable-column>
        <ngx-datatable-column [name]="'::LastName' | abpLocalization" prop="lastName"></ngx-datatable-column>

        <ngx-datatable-column [name]="'::Gender' | abpLocalization" prop="gender">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ '::Enum:Gender.' + row.gender | abpLocalization }}
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column [name]="'::DOB' | abpLocalization" prop="dob">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ row.dob | date: 'yyyy-MM-dd' }}
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column [name]="'::EnrollmentDate' | abpLocalization" prop="enrollmentDate">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ row.enrollmentDate | date: 'yyyy-MM-dd' }}
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column [name]="'::Status' | abpLocalization" prop="status">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ '::Enum:Status.' + row.status | abpLocalization }}
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column [name]="'::Email' | abpLocalization" prop="email"></ngx-datatable-column>
        <ngx-datatable-column [name]="'::ParentPhone' | abpLocalization" prop="pPhone"></ngx-datatable-column>
      </ngx-datatable>
    </div>
  </div>
</abp-page>

<abp-modal [(visible)]="isTemplateModalOpen" [options]="{ size: 'lg' }">
  <ng-template #abpHeader>
    <h5 class="mb-0">{{ '::DownloadImportTemplate' | abpLocalization }}</h5>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="templateForm" class="row g-3">

      <div class="col-12 col-md-6">
        <label class="form-label">{{ '::GradeLevel' | abpLocalization }}</label>
        <nz-select class="w-100" nzShowSearch nzAllowClear formControlName="gradeLevel">
          <nz-option *ngFor="let g of gradeLevels" [nzValue]="g.value"
            [nzLabel]="'::Enum:GradeLevel.' + g.value | abpLocalization">
          </nz-option>
        </nz-select>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">{{ '::Section' | abpLocalization }}</label>
        <nz-select class="w-100" nzShowSearch nzAllowClear formControlName="section">
          <nz-option *ngFor="let s of sections" [nzValue]="s.value"
            [nzLabel]="'::Enum:Section.' + s.value | abpLocalization">
          </nz-option>
        </nz-select>
      </div>

      <div class="col-12">
        <div class="form-check mt-2">
          <input id="includeExisting" class="form-check-input" type="checkbox"
            formControlName="includeExistingStudents" />
          <label class="form-check-label" for="includeExisting">
            {{ '::IncludeExistingStudents' | abpLocalization }}
          </label>
        </div>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label">{{ '::ExtraEmptyRows' | abpLocalization }}</label>
        <input type="number" class="form-control" min="0" max="500" formControlName="extraEmptyRows" />
        <small class="text-muted">{{ '::ExtraEmptyRowsHelp' | abpLocalization }}</small>
      </div>

    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button class="btn btn-light" type="button" (click)="closeTemplateModal()">
      {{ '::Cancel' | abpLocalization }}
    </button>

    <button class="btn btn-primary" type="button" (click)="generateTemplate()" [disabled]="templateForm.invalid">
      <i class="fa fa-download me-1"></i>
      {{ '::Download' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>
