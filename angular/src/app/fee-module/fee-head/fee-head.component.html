<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-4">
        <h5 class="card-title">
          {{ '::Menu:FeeHeads' | abpLocalization }}
        </h5>
      </div>

      <div class="text-end col col-md-8">
        <div class="text-lg-end">
          <button
            *abpPermission="'EHub.FeeHeads.Create'"
            id="create"
            class="btn btn-outline-primary btn-sm"
            type="button"
            (click)="create()"
          >
            <i class="fa fa-plus me-1"></i>
            <span>{{ '::New' | abpLocalization }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="card-body">
    <ngx-datatable [rows]="feeHeads.items" [count]="feeHeads.totalCount" [list]="list" default>
      <ngx-datatable-column
        [name]="'::Actions' | abpLocalization"
        [maxWidth]="180"
        [sortable]="false"
      >
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div ngbDropdown container="body" class="d-inline-block">
            <button
              class="btn btn-primary btn-sm dropdown-toggle"
              aria-haspopup="true"
              ngbDropdownToggle
            >
              <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
            </button>

            <div ngbDropdownMenu>
              <button
                *abpPermission="'EHub.FeeHeads.Edit'"
                ngbDropdownItem
                (click)="edit(row.id)"
              >
                {{ '::Edit' | abpLocalization }}
              </button>

              <button
                *abpPermission="'EHub.FeeHeads.Edit'"
                ngbDropdownItem
                (click)="toggleActive(row)"
              >
                {{ (row.isActive ? '::Deactivate' : '::Activate') | abpLocalization }}
              </button>

              <button
                *abpPermission="'EHub.FeeHeads.Delete'"
                ngbDropdownItem
                (click)="delete(row.id)"
              >
                {{ '::Delete' | abpLocalization }}
              </button>
            </div>
          </div>
        </ng-template>
      </ngx-datatable-column>

      <ngx-datatable-column [name]="'::Name' | abpLocalization" prop="name"></ngx-datatable-column>

      <ngx-datatable-column [name]="'::IsActive' | abpLocalization" [maxWidth]="130">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <span class="badge" [ngClass]="row.isActive ? 'bg-success' : 'bg-secondary'">
            {{ (row.isActive ? '::Yes' : '::No') | abpLocalization }}
          </span>
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </div>
</div>

<abp-modal [(visible)]="isModalOpen">
  <ng-template #abpHeader>
    <h3>{{ (selected.id ? '::EditFeeHead' : '::NewFeeHead') | abpLocalization }}</h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="form-group">
        <label for="feehead-name">{{ '::Name' | abpLocalization }}</label><span class="text-danger"> * </span>
        <input
          type="text"
          id="feehead-name"
          class="form-control"
          formControlName="name"
          autofocus
        />
      </div>

      <div class="form-check mt-3">
        <input class="form-check-input" type="checkbox" id="feehead-active" formControlName="isActive" />
        <label class="form-check-label" for="feehead-active">
          {{ '::IsActive' | abpLocalization }}
        </label>
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" abpClose>
      {{ '::Close' | abpLocalization }}
    </button>

    <button class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
      <i class="fa fa-check mr-1"></i>
      {{ '::Save' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>
