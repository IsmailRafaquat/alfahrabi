<div class="app-topbar">
    <div class="app-topbar-header">
        <h4 class="m-0 fw-bold app-topbar-title">{{ titleKey | abpLocalization }}</h4>

        <div class="app-topbar-actions">
            <ng-content select="[topbarPills]"></ng-content>

            @if (showSearch) {
            <div class="app-search-container">
                <input
                    type="search"
                    class="form-control form-control-sm"
                    id="topbar-search-input"
                    name="topbar-search-input"
                    [(ngModel)]="filters.filter"
                    [placeholder]="searchPlaceholder | abpLocalization"
                    (keydown.enter)="filter()"
                />
                <i role="button" class="fas fa-search" (click)="filter()"></i>
            </div>
            }

            @if (showFiltersToggle) {
            <button class="btn btn-sm btn-outline-primary text-nowrap" type="button" (click)="toggleFilters()">
                <i class="fas fa-filter"></i>
            </button>
            }

            <ng-content select="[topbarActions]"></ng-content>
        </div>
    </div>

    @if (showFiltersToggle) {
    <div class="p-2 border border-1 mt-2 rounded-1 app-topbar-filter-section" [class.collapsed]="!filtersVisible">
        <h5 class="mb-2">{{ filtersTitleKey | abpLocalization }}</h5>
        <div class="row g-3 app-topbar-filters-row">
            <ng-content select="[topbarFilters]"></ng-content>
            <div class="col-12 col-md-auto d-flex align-items-end gap-2 flex-wrap">
                @if(showResetFilters){
                    <button (click)="reset()" type="reset" class="btn btn-sm btn-outline-primary">
                        <i class="fas fa-refresh"></i>
                        {{ '::Button:Reset' | abpLocalization }}
                    </button>
                }
                @if(showApplyFilters){
                    <button (click)="filter()" class="btn btn-sm btn-primary">
                        <i class="fas fa-filter"></i>
                        {{ '::Button:Filter' | abpLocalization }}
                    </button>
                }
            </div>
        </div>
    </div>
    }
</div>

<div class="app-content" [class.full-width]="fullWidthContent">
    <ng-content></ng-content>
</div>
