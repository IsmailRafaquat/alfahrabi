<abp-page [title]="'::Menu:Staffs' | abpLocalization">
  <abp-page-toolbar-container class="col">
    <div class="text-end">
      <button id="create" class="btn btn-outline-primary btn-sm" type="button" (click)="createStaff()">
        <i class="fa fa-plus me-1"></i> {{ '::NewStaff' | abpLocalization }}
      </button>
    </div>
  </abp-page-toolbar-container>

  <!-- Search + Filters -->
  <div class="card">
    <div class="card-body">
      <div class="row align-items-center">
        <div class="col-10">
          <div class="input-group">
            <input
              type="text"
              class="form-control"
              [placeholder]="'::SearchHere' | abpLocalization"
              [(ngModel)]="filters.filter"
            />
            <button type="button" class="btn btn-primary" (click)="list.get()">
              <i class="fa fa-search"></i>
            </button>
          </div>
        </div>
        <div class="col-2 text-end">
          <button class="btn btn-outline-primary w-100" (click)="showFilter = !showFilter">
            {{ '::Filters' | abpLocalization }}
            <i class="fas" [ngClass]="showFilter ? 'fa-angle-up' : 'fa-angle-down'"></i>
          </button>
        </div>
      </div>

      <!-- Filter Panel -->
      <div *ngIf="showFilter" class="mt-2">
        <div class="row g-2">
          <div class="col-sm-2">
            <label>{{ '::FirstName' | abpLocalization }}</label>
            <input class="form-control form-control-sm" [(ngModel)]="filters.firstName" />
          </div>
          <div class="col-sm-2">
            <label>{{ '::LastName' | abpLocalization }}</label>
            <input class="form-control form-control-sm" [(ngModel)]="filters.lastName" />
          </div>
          <div class="col-sm-2">
            <label>{{ '::Department' | abpLocalization }}</label>
            <nz-select [(ngModel)]="filters.department" nzAllowClear nzShowSearch class="form-control-sm" class="w-100">
              <nz-option
                *ngFor="let d of departments"
                [nzValue]="d.value"
                [nzLabel]="'::Enum:Department.' + d.value | abpLocalization"
              ></nz-option>
            </nz-select>
          </div>
          <div class="col-sm-2">
            <label>{{ '::JobStatus' | abpLocalization }}</label>
            <nz-select [(ngModel)]="filters.jobStatus" nzAllowClear nzShowSearch  class="form-control-sm" class="w-100">
              <nz-option
                *ngFor="let j of statuses"
                [nzValue]="j.value"
                [nzLabel]="'::Enum:JobStatus.' + j.value | abpLocalization"
              ></nz-option>
            </nz-select>
          </div>

          <div class="col-sm-auto d-flex align-items-end mt-2 gap-1">
            <button type="button" class="btn btn-sm btn-outline-primary" (click)="clearFilters()">
              <i class="fas fa-undo"></i> {{ '::Reset' | abpLocalization }}
            </button>
            <button type="button" class="btn btn-primary btn-sm" (click)="list.get()">
              <i class="fa fa-filter"></i> {{ '::Apply' | abpLocalization }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="card mt-2">
    <div class="card-body">
      <ngx-datatable [rows]="staffs.items" [count]="staffs.totalCount" [list]="list" default>
        <ngx-datatable-column [name]="'::Actions' | abpLocalization" [maxWidth]="150" [sortable]="false">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <div ngbDropdown container="body" class="d-inline-block">
              <button class="btn btn-primary btn-sm dropdown-toggle" ngbDropdownToggle>
                <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
              </button>
              <div ngbDropdownMenu>
                <button ngbDropdownItem (click)="delete(row.id)">
                  {{ '::Delete' | abpLocalization }}
                </button>
                <button ngbDropdownItem (click)="viewStaffDetails(row.id)">
                  {{ '::ViewDetails' | abpLocalization }}
                </button>
                <button ngbDropdownItem (click)="openWhatsApp(row.phoneNo)">
                  {{ '::MessageOnWhatsApp' | abpLocalization }}
                </button>
              </div>
            </div>
          </ng-template>
        </ngx-datatable-column>

        <ngx-datatable-column [name]="'::EmployeeCode' | abpLocalization" prop="employeeCode"></ngx-datatable-column>
        <ngx-datatable-column [name]="'::FirstName' | abpLocalization" prop="firstName"></ngx-datatable-column>
        <ngx-datatable-column [name]="'::LastName' | abpLocalization" prop="lastName"></ngx-datatable-column>
        <ngx-datatable-column [name]="'::Department' | abpLocalization" prop="department">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ '::Enum:Department.' + row.department | abpLocalization }}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column [name]="'::Designation' | abpLocalization" prop="designation"></ngx-datatable-column>
        <ngx-datatable-column [name]="'::EmploymentType' | abpLocalization" prop="employmentType">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ '::Enum:EmploymentType.' + row.employmentType | abpLocalization }}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column [name]="'::JobStatus' | abpLocalization" prop="jobStatus">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ '::Enum:JobStatus.' + row.jobStatus | abpLocalization }}
          </ng-template>
        </ngx-datatable-column>
        <ngx-datatable-column [name]="'::JoiningDate' | abpLocalization" prop="joiningDate">
          <ng-template let-row="row" ngx-datatable-cell-template>
            {{ row.joiningDate | date: 'yyyy-MM-dd' }}
          </ng-template>
        </ngx-datatable-column>
      </ngx-datatable>
    </div>
  </div>
</abp-page>
